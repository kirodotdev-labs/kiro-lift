[project]
name = "kiro-lift"
version = "0.1.0"
description = "Measure the lift of knowledge augmentations (MCP servers, skills, steering, agents) for Kiro by paired A/B testing against a baseline agent."
requires-python = ">=3.10"
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
kiro-lift = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
